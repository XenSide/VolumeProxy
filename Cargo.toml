[package]
name = "VolumeProxy"
version = "0.1.0"
edition = "2021"

# The binary is named "Foreground" so mixers that fall back to the exe name
# (e.g. the Stream Deck volume plugin) label the session "Foreground".
[[bin]]
name = "Foreground"
path = "src/main.rs"

[dependencies]
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = ["implement", "Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_ProcessStatus", "Win32_UI_Shell_PropertiesSystem"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
